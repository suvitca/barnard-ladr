# ── Current lab members ──────────────────────────────────────
- name: "Ann Senghas, Ph.D."
  group: current
  role: "Principal Investigator"
  photo: "senghas-forweb.jpg"
  email: "asenghas@barnard.edu"
  links:
    - { label: "Barnard profile", url: "https://barnard.edu/profiles/ann-senghas" }
  cv: true   # shows a "Download CV" link (uses the CV set in site.yml)
  summary: >-
    Claire Tow Professor of Psychology at Barnard College, director of the
    Program in Cognitive Science, and director of the LADR Lab.
  bio: >-
    Ann Senghas's work examines the ways in which language users create
    ordered systems from disordered input and how this ability develops over
    the lifespan. Her research focuses on the emergence of grammatical
    structure in a new sign language created by deaf children and adolescents
    in Nicaragua over the past four decades. Through this work, she strives to
    capture the nature of language at its origin, and the interplay between
    human cognition, human social experience, and language creation.


    Senghas earned her PhD in brain and cognitive sciences in 1995 from the
    Massachusetts Institute of Technology. She was a postdoctoral fellow at the
    University of Rochester's Sign Language Research Center and a research
    staff member at the Max Planck Institute for Psycholinguistics in the
    Netherlands. Her research has been supported by the National Institutes of
    Health since 2002. She was a National Academy of Sciences Kavli Frontiers
    of Science participant and is a fellow of the Association for
    Psychological Science.

- name: "Ezra Plançon, M.A."
  group: current
  role: "Lab Manager"
  photo: "plancon-forweb.jpg"
  email: "eplancon@barnard.edu"
  summary: >-
    Joined the lab as manager in 2015. BS in English Education from NYU and
    MA in Deaf Studies from Gallaudet University.
  bio: >-
    His background with multimodal teaching approaches has framed his graduate
    research on literacy, language acquisition, and language socialization
    among the deaf community. He has presented work with the Center for
    Research on Language at UC San Diego, and his research has been funded by
    Gallaudet University and Visual Language and Visual Learning (VL2), a
    National Science Foundation Science of Learning Center. His graduate work
    focused on emoji use in text messages among deaf youth.

- name: "Amber Martin, Ph.D."
  group: current
  role: "Postdoctoral Fellow"
  photo: "ambershortbio.jpg"
  email: "amartin@barnard.edu"
  links:
    - { label: "Hunter College", url: "http://www.hunter.cuny.edu/psychology/faculty/cognitive-psychology/martin" }
  summary: >-
    Assistant Professor at Hunter College and a postdoctoral fellow in the
    LADR Lab since 2009.
  bio: >-
    A Deaf Minnesota native, Amber Martin received her B.S. in Child Psychology
    from the University of Minnesota in 2000 and her Ph.D. from the University
    of Minnesota's Institute of Child Development in 2009. Her research asks
    how the age of language acquisition affects the relations between language
    and cognition — comparing typical acquisition with early language
    deprivation, and comparing the spatial cognitive skills (like mental
    rotation) of signers and non-signers.

- name: "Caroline Zola"
  group: current
  role: "Undergraduate Research Assistant"
  photo: "carolineshortbio2.jpg"
  email: "cez2109@barnard.edu"
  summary: >-
    Barnard College '17, majoring in Linguistics and minoring in Anthropology.
  bio: >-
    Caroline is interested in sociolinguistics, language change, sign
    languages and Deaf culture. She was a Summer Research Institute scholar in
    2015, working on the Iconicity and Spatial Language and Cognition projects.

- name: "Charlotte Quincoses"
  group: current
  role: "Undergraduate Research Assistant"
  photo: "charlotteshortbio.jpg"
  email: "cq2174@barnard.edu"
  summary: >-
    Barnard College '18, studying psychology, with an interest in how mental
    illness affects teen development, especially among Latin American
    populations.

